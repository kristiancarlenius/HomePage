{% extends "base.html" %}
{% block title %}Delete Repo{% endblock %}
{% block content %}
<div class="card" style="max-width:500px;">
    <h1>Remove "{{ repo.name }}"?</h1>
    <form method="post">
        {% csrf_token %}
        <button class="btn" type="submit">Yes, remove</button>
        <a class="btn secondary" href="{% url 'repo_edit' repo.pk %}">Cancel</a>
    </form>
</div>
{% endblock %}
