{% extends "base.html" %}
{% block title %}{% if entry %}Edit{% else %}Log{% endif %} Hours{% endblock %}
{% block content %}
<div class="card" style="max-width:500px;">
    <h1>{% if entry %}Edit entry{% else %}Log hours{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Save</button>
        <a class="btn secondary" href="{% url 'my_hours' %}">Cancel</a>
        {% if entry %}<a class="btn secondary" href="{% url 'entry_delete' entry.pk %}">Delete</a>{% endif %}
    </form>
</div>
{% endblock %}
