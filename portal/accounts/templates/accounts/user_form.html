{% extends "base.html" %}
{% block title %}Add User - Carlenius AI Portal{% endblock %}
{% block content %}
<div class="card" style="max-width:400px;">
    <h1>Add user</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Create account</button>
        <a class="btn secondary" href="{% url 'dashboard' %}">Done</a>
    </form>
</div>
{% endblock %}
