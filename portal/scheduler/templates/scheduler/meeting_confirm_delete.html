{% extends "base.html" %}
{% block title %}Delete Meeting{% endblock %}
{% block content %}
<div class="card" style="max-width:500px;">
    <h1>Delete "{{ meeting.title }}"?</h1>
    <form method="post">
        {% csrf_token %}
        <button class="btn" type="submit">Yes, delete</button>
        <a class="btn secondary" href="{% url 'meeting_edit' meeting.pk %}">Cancel</a>
    </form>
</div>
{% endblock %}
