{% extends "base.html" %}
{% block title %}{% if meeting %}Edit{% else %}New{% endif %} Meeting{% endblock %}
{% block content %}
<div class="card" style="max-width:500px;">
    <h1>{% if meeting %}Edit meeting{% else %}New meeting{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Save</button>
        <a class="btn secondary" href="{% url 'calendar' %}">Cancel</a>
        {% if meeting %}<a class="btn secondary" href="{% url 'meeting_delete' meeting.pk %}">Delete</a>{% endif %}
    </form>
</div>
{% endblock %}
